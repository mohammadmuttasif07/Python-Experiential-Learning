
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Dice Simulator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 { color: #4338ca; }

        select, button {
            padding: 12px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
        }

        .dice {
            font-size: 55px;
            margin: 15px 5px;
        }

        .total {
            font-size: 24px;
            color: #15803d;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎲 Rolling Dice Simulator</h1>
        <p>Select the number of dice and roll!</p>

        <form method="POST">
            <label for="number">Number of dice:</label>

            <select name="number" id="number">
                {% for n in range(1, 11) %}
                <option value="{{ n }}"
                    {% if number == n %}selected{% endif %}>
                    {{ n }}
                </option>
                {% endfor %}
            </select>

            <br>
            <button type="submit">🎲 Roll Dice</button>
        </form>

        {% if dice %}
        <h2>Your Results</h2>

        <div>
            {% set faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'] %}
            {% for value in dice %}
                <span class="dice">{{ faces[value - 1] }}</span>
            {% endfor %}
        </div>

        <p class="total">Total: {{ total }}</p>
        {% endif %}
    </div>
</body>
</html>
